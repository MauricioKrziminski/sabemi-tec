services:
  db:
    image: postgres:17-alpine
    container_name: sabemi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabemi}
      POSTGRES_DB: ${POSTGRES_DB:-sabemi_payments}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sabemi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabemi} -d ${POSTGRES_DB:-sabemi_payments}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sabemi-db-data:
